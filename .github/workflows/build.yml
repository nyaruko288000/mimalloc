name: Build Mimalloc (GLIBC 2.31 + New CMake)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-legacy:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai

    steps:
    - name: Install Git and Essentials
      run: |
        apt-get update
        apt-get install -yq git wget software-properties-common tzdata

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Build Tools & Upgrade CMake
      run: |
        apt-get update
        # 1. 安装 Python pip 和编译工具 (注意：这里不安装 apt 里的 cmake)
        apt-get install -yq python3-pip clang lld ninja-build \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          binutils

        # 2. 使用 pip 安装最新版 CMake (这一步解决了 3.16 版本过低的问题)
        pip3 install cmake --upgrade
        
        # 3. 验证版本
        echo "CMake Version:"
        cmake --version

    - name: Build with CMake
      run: |
        mkdir -p build
        cd build
        
        COMMON_FLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 \
          -flto=full \
          -fstack-protector-strong \
          -funroll-loops \
          -fno-plt \
          -fomit-frame-pointer -DNDEBUG \
          -fvisibility=hidden -fvisibility-inlines-hidden \
          -falign-functions=32 \
          -fno-math-errno \
          -Wno-unused-command-line-argument"
        
        MY_C_FLAGS="$COMMON_FLAGS -std=gnu17"
        MY_CXX_FLAGS="$COMMON_FLAGS"
          
        MY_LDFLAGS="-flto=full -fuse-ld=lld -Wl,-O3 -Wl,--icf=all -Wl,-z,relro,-z,now -s"

        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_C_FLAGS="$MY_C_FLAGS" \
          -DCMAKE_CXX_FLAGS="$MY_CXX_FLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_SHARED_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_MODULE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DMI_BUILD_TESTS=OFF \
          -DMI_BUILD_SHARED=ON \
          -DMI_BUILD_STATIC=ON \
          -DMI_OVERRIDE=ON

    - name: Compile
      run: |
        cd build
        ninja -v

    - name: Verify GLIBC & Arch
      run: |
        echo "=== GLIBC Requirement (Should satisfy GLIBC 2.31) ==="
        objdump -p build/libmimalloc.so | grep "GLIBC_2." | sort -u
        echo "=== Architecture (Should be aarch64) ==="
        file build/libmimalloc.so

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimalloc-glibc2.31-compatible
        path: |
          build/libmimalloc.so
