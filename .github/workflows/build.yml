name: Build Mimalloc (Clang Cross Fix)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-legacy-fixed:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai

    steps:
    - name: Install Git and Essentials
      run: |
        apt-get update
        apt-get install -yq git wget software-properties-common tzdata

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Build Tools & Upgrade CMake
      run: |
        apt-get update
        # 1. 显式安装 libc6-dev-arm64-cross 确保头文件绝对存在
        apt-get install -yq python3-pip clang lld ninja-build \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libc6-dev-arm64-cross binutils

        # 2. 升级 CMake
        pip3 install cmake --upgrade

    - name: Build with CMake
      run: |
        mkdir -p build
        cd build
        
        # === 核心修复 ===
        # 1. -I/usr/aarch64-linux-gnu/include : 手动指定 ARM 头文件路径，解决 "bits/libc-header-start.h not found"
        # 2. 移除了 polly (以防万一)，保留 cortex-a53 优化
        COMMON_FLAGS="-I/usr/aarch64-linux-gnu/include \
          -O3 -mcpu=cortex-a53 -mtune=cortex-a53 \
          -flto=full \
          -fstack-protector-strong \
          -funroll-loops \
          -fno-plt \
          -fomit-frame-pointer -DNDEBUG \
          -fvisibility=hidden -fvisibility-inlines-hidden \
          -falign-functions=32 \
          -fno-math-errno \
          -Wno-unused-command-line-argument"
        
        MY_C_FLAGS="$COMMON_FLAGS -std=gnu17"
        MY_CXX_FLAGS="$COMMON_FLAGS"
          
        # === 链接修复 ===
        # -L/usr/aarch64-linux-gnu/lib : 手动指定库路径，替代 --sysroot，防止路径重叠报错
        MY_LDFLAGS="-L/usr/aarch64-linux-gnu/lib \
          -flto=full -fuse-ld=lld \
          -Wl,-O3 -Wl,--icf=all -Wl,-z,relro,-z,now -s"

        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_C_FLAGS="$MY_C_FLAGS" \
          -DCMAKE_CXX_FLAGS="$MY_CXX_FLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_SHARED_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_MODULE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DMI_BUILD_TESTS=OFF \
          -DMI_BUILD_SHARED=ON \
          -DMI_BUILD_STATIC=ON \
          -DMI_OVERRIDE=ON

    - name: Compile
      run: |
        cd build
        ninja -v

    - name: Verify
      run: |
        echo "=== GLIBC Requirement ==="
        objdump -p build/libmimalloc.so | grep "GLIBC_2." | sort -u
        echo "=== Architecture ==="
        file build/libmimalloc.so

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimalloc-glibc2.31-fixed
        path: |
          build/libmimalloc.so
