name: Build Mimalloc (Strict GLIBC 2.31 Compatible)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-legacy:
    # 关键点：虽然宿主机是最新版，但我们强行进入 Ubuntu 20.04 容器内部工作
    # 这样生成的 so 文件就是基于 GLIBC 2.31 的，完美匹配你的盒子
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
    - name: Install Git and Essentials (Container Prep)
      run: |
        # 容器内通常是最小化安装，先装 git 和 wget 以便 checkout 能工作
        apt-get update
        apt-get install -y git wget software-properties-common

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        apt-get update
        # 安装 Clang, LLD, CMake, Ninja 和 ARM64 交叉编译包
        # Ubuntu 20.04 默认源里的 Clang 版本较老(v10)，但足够稳定
        apt-get install -y clang lld ninja-build cmake \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          binutils

    - name: Build with CMake
      run: |
        mkdir -p build
        cd build
        
        # === 优化参数 (适配 Clang 10/11) ===
        # 移除了 Polly (旧版 Clang 支持不好容易报错)
        # 保留核心 Cortex-A53 优化和 LTO
        COMMON_FLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 \
          -flto=full \
          -fstack-protector-strong \
          -funroll-loops \
          -fno-plt \
          -fomit-frame-pointer -DNDEBUG \
          -fvisibility=hidden -fvisibility-inlines-hidden \
          -falign-functions=32 \
          -fno-math-errno \
          -Wno-unused-command-line-argument"
        
        MY_C_FLAGS="$COMMON_FLAGS -std=gnu17"
        MY_CXX_FLAGS="$COMMON_FLAGS"
          
        MY_LDFLAGS="-flto=full -fuse-ld=lld -Wl,-O3 -Wl,--icf=all -Wl,-z,relro,-z,now -s"

        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_C_FLAGS="$MY_C_FLAGS" \
          -DCMAKE_CXX_FLAGS="$MY_CXX_FLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_SHARED_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_MODULE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DMI_BUILD_TESTS=OFF \
          -DMI_BUILD_SHARED=ON \
          -DMI_BUILD_STATIC=ON \
          -DMI_OVERRIDE=ON

    - name: Compile
      run: |
        cd build
        ninja -v

    - name: Verify GLIBC Version
      run: |
        echo "检查生成的库文件依赖版本（不应出现 GLIBC_2.32 及以上）："
        # objdump 需要 binutils 包
        objdump -p build/libmimalloc.so | grep "GLIBC_2." | sort -u
        echo "------------------------------------------------"
        echo "文件架构检查："
        file build/libmimalloc.so

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimalloc-glibc2.31-compatible
        path: |
          build/libmimalloc.so
