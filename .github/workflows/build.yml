name: Build Mimalloc (GLIBC 2.31 Fixed)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-legacy:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    
    # === 关键修复：添加这两行环境变量 ===
    # 这会告诉 apt-get 闭嘴，不要弹出任何蓝色的选择框
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai

    steps:
    - name: Install Git and Essentials (Container Prep)
      run: |
        apt-get update
        # -yq 表示 yes 和 quiet，配合环境变量彻底静默安装
        apt-get install -yq git wget software-properties-common tzdata

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        apt-get update
        apt-get install -yq clang lld ninja-build cmake \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          binutils

    - name: Build with CMake
      run: |
        mkdir -p build
        cd build
        
        # 针对 Cortex-A53 的优化参数
        COMMON_FLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 \
          -flto=full \
          -fstack-protector-strong \
          -funroll-loops \
          -fno-plt \
          -fomit-frame-pointer -DNDEBUG \
          -fvisibility=hidden -fvisibility-inlines-hidden \
          -falign-functions=32 \
          -fno-math-errno \
          -Wno-unused-command-line-argument"
        
        MY_C_FLAGS="$COMMON_FLAGS -std=gnu17"
        MY_CXX_FLAGS="$COMMON_FLAGS"
          
        MY_LDFLAGS="-flto=full -fuse-ld=lld -Wl,-O3 -Wl,--icf=all -Wl,-z,relro,-z,now -s"

        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_C_FLAGS="$MY_C_FLAGS" \
          -DCMAKE_CXX_FLAGS="$MY_CXX_FLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_SHARED_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_MODULE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DMI_BUILD_TESTS=OFF \
          -DMI_BUILD_SHARED=ON \
          -DMI_BUILD_STATIC=ON \
          -DMI_OVERRIDE=ON

    - name: Compile
      run: |
        cd build
        ninja -v

    - name: Verify GLIBC Version
      run: |
        echo "检查 GLIBC 依赖："
        objdump -p build/libmimalloc.so | grep "GLIBC_2." | sort -u
        echo "文件架构检查："
        file build/libmimalloc.so

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimalloc-glibc2.31-compatible
        path: |
          build/libmimalloc.so
