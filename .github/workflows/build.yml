name: Build Mimalloc for Cortex-A53 (Fixed)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld ninja-build cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Build with CMake
      run: |
        # 创建构建目录
        mkdir -p build
        cd build
        
        # 定义 Flags 变量（为了整洁）
        # 1. 移除了 --sysroot (关键修复)
        # 2. 移除了 --target (交给 CMake 处理)
        # 3. 移除了 -march=native, 改为 cortex-a53
        
        MY_CFLAGS="-std=gnu17 -O3 -mcpu=cortex-a53 -mtune=cortex-a53 \
          -flto=full \
          -fstack-protector-strong \
          -funroll-loops \
          -fno-plt \
          -fomit-frame-pointer -DNDEBUG \
          -fvisibility=hidden -fvisibility-inlines-hidden \
          -falign-functions=32 \
          -fno-semantic-interposition \
          -fno-math-errno \
          -mllvm -polly -mllvm -polly-vectorizer=stripmine \
          -mllvm -inline-threshold=1200 \
          -mllvm -unroll-threshold=400 \
          -mllvm -enable-loop-distribute \
          -Wno-unused-command-line-argument"
          
        MY_LDFLAGS="-flto=full -fuse-ld=lld -Wl,-O3 -Wl,--icf=all -Wl,-z,relro,-z,now -s"

        # 运行 CMake
        # 关键点：使用 CMAKE_C_COMPILER_TARGET 告诉 CMake 我们要交叉编译
        # 这样 CMake 会自动把 --target 传给 clang，同时正确寻找库路径
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_C_FLAGS="$MY_CFLAGS" \
          -DCMAKE_CXX_FLAGS="$MY_CFLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_SHARED_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_MODULE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DMI_BUILD_TESTS=OFF \
          -DMI_BUILD_SHARED=ON \
          -DMI_BUILD_STATIC=ON \
          -DMI_OVERRIDE=ON

    - name: Compile
      run: |
        cd build
        ninja -v

    - name: Verify Architecture
      run: |
        echo "检查文件架构（必须显示 ARM aarch64）："
        file build/libmimalloc.so

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimalloc-cortex-a53-release
        path: |
          build/libmimalloc.so
          build/libmimalloc.a
