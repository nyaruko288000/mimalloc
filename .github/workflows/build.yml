name: Build Mimalloc (GCC + Compatible TLS)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-gcc-safe:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai

    steps:
    - name: Install Git and Essentials
      run: |
        apt-get update
        apt-get install -yq git wget software-properties-common tzdata

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install GCC Cross Compiler & CMake
      run: |
        apt-get update
        # 安装 GCC 交叉编译器
        apt-get install -yq python3-pip ninja-build \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          binutils

        # 升级 CMake
        pip3 install cmake --upgrade

    - name: Build with GCC
      run: |
        mkdir -p build
        cd build
        
        # === GCC 专用保守参数 ===
        # 1. -ftls-model=global-dynamic : 解决非法指令的关键！防止 initial-exec 崩溃
        # 2. -fno-builtin-malloc : 防止编译器自作聪明
        COMMON_FLAGS="-O2 \
          -march=armv8-a \
          -mtune=cortex-a53 \
          -ftls-model=global-dynamic \
          -fno-builtin-malloc \
          -fno-builtin-calloc \
          -fno-builtin-realloc \
          -fno-builtin-free \
          -fvisibility=hidden"
        
        # GCC 不需要像 Clang 那样手动指定 -I / -L，它自己知道去哪找
        
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_C_FLAGS="$COMMON_FLAGS -std=gnu11" \
          -DCMAKE_CXX_FLAGS="$COMMON_FLAGS" \
          -DMI_BUILD_TESTS=OFF \
          -DMI_BUILD_SHARED=ON \
          -DMI_BUILD_STATIC=ON \
          -DMI_OVERRIDE=ON \
          -DMI_USE_CXX=OFF \
          -DMI_SEE_ASM=OFF

    - name: Compile
      run: |
        cd build
        ninja -v

    - name: Check
      run: |
        echo "架构检查："
        file build/libmimalloc.so
        echo "符号检查 (确认没有 LSE 原子指令)："
        # 这一步只是为了确认，如果 grep 有输出说明有危险指令
        objdump -d build/libmimalloc.so | grep -E "casal|ldadd|stadd" | head -n 5 || echo "Safe: No LSE atomics found."

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimalloc-gcc-compatible
        path: |
          build/libmimalloc.so
