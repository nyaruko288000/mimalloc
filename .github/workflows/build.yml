name: Build Mimalloc (Rescue Mode - No Atomics)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-rescue:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai

    steps:
    - name: Install Git and Essentials
      run: |
        apt-get update
        apt-get install -yq git wget software-properties-common tzdata

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install GCC Cross & CMake
      run: |
        apt-get update
        apt-get install -yq python3-pip ninja-build \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          binutils

        pip3 install cmake --upgrade

    - name: Build with Rescue Flags
      run: |
        mkdir -p build
        cd build
        
        # === 救命参数详解 ===
        # 1. -mno-outline-atomics : 核心修复！禁止生成 LSE 原子指令检测代码
        # 2. -march=armv8-a+crc : 仅开启基础指令和 CRC（你的 lscpu 显示支持 crc32）
        # 3. -O2 : 保持稳健优化
        COMMON_FLAGS="-O2 \
          -march=armv8-a+crc \
          -mtune=cortex-a53 \
          -mno-outline-atomics \
          -fno-builtin-malloc \
          -fno-builtin-calloc \
          -fno-builtin-realloc \
          -fno-builtin-free \
          -fvisibility=hidden"
        
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
          -DCMAKE_C_FLAGS="$COMMON_FLAGS -std=gnu11" \
          -DCMAKE_CXX_FLAGS="$COMMON_FLAGS" \
          -DMI_BUILD_TESTS=OFF \
          -DMI_BUILD_SHARED=ON \
          -DMI_BUILD_STATIC=ON \
          -DMI_OVERRIDE=ON \
          -DMI_USE_CXX=OFF \
          -DMI_SEE_ASM=OFF

    - name: Compile
      run: |
        cd build
        ninja -v

    - name: Safety Check
      run: |
        echo "架构检查："
        file build/libmimalloc.so

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimalloc-rescue-mode
        path: |
          build/libmimalloc.so
