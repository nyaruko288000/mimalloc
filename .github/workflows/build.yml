name: Build Mimalloc for Cortex-A53 (Final Fix)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld ninja-build cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Build with CMake
      run: |
        mkdir -p build
        cd build
        
        # === 1. 定义通用优化参数 (C 和 C++ 都能用的) ===
        # 注意：这里不包含 -std=gnu17
        COMMON_FLAGS="-O3 -mcpu=cortex-a53 -mtune=cortex-a53 \
          -flto=full \
          -fstack-protector-strong \
          -funroll-loops \
          -fno-plt \
          -fomit-frame-pointer -DNDEBUG \
          -fvisibility=hidden -fvisibility-inlines-hidden \
          -falign-functions=32 \
          -fno-semantic-interposition \
          -fno-math-errno \
          -mllvm -polly -mllvm -polly-vectorizer=stripmine \
          -mllvm -inline-threshold=1200 \
          -mllvm -unroll-threshold=400 \
          -mllvm -enable-loop-distribute \
          -Wno-unused-command-line-argument"
        
        # === 2. 定义 C 语言专用参数 ===
        # 这里加上 -std=gnu17
        MY_C_FLAGS="$COMMON_FLAGS -std=gnu17"
        
        # === 3. 定义 C++ 语言专用参数 ===
        # C++ 不可以使用 -std=gnu17，我们让它使用默认标准，或者你可以指定 -std=gnu++17
        MY_CXX_FLAGS="$COMMON_FLAGS"
          
        MY_LDFLAGS="-flto=full -fuse-ld=lld -Wl,-O3 -Wl,--icf=all -Wl,-z,relro,-z,now -s"

        # === 4. 运行 CMake ===
        # 关键点：分别传入 C_FLAGS 和 CXX_FLAGS
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
          -DCMAKE_C_FLAGS="$MY_C_FLAGS" \
          -DCMAKE_CXX_FLAGS="$MY_CXX_FLAGS" \
          -DCMAKE_EXE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_SHARED_LINKER_FLAGS="$MY_LDFLAGS" \
          -DCMAKE_MODULE_LINKER_FLAGS="$MY_LDFLAGS" \
          -DMI_BUILD_TESTS=OFF \
          -DMI_BUILD_SHARED=ON \
          -DMI_BUILD_STATIC=ON \
          -DMI_OVERRIDE=ON

    - name: Compile
      run: |
        cd build
        ninja -v

    - name: Verify Architecture
      run: |
        echo "检查文件架构（必须显示 ARM aarch64）："
        file build/libmimalloc.so

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimalloc-cortex-a53-release
        path: |
          build/libmimalloc.so
          build/libmimalloc.a
